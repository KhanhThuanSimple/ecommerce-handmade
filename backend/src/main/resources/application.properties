# ============================================================
#   PROFILE: LOCAL - Dành riêng cho môi trường phát triển
#   Chạy bằng: --spring.profiles.active=local
# ============================================================
server.port=8080
app.frontend-url=http://localhost:3000
app.cors-allowed-origins=http://localhost:3000
# ===== DATABASE LOCAL (PostgreSQL cài trên máy) =====
# Đảm bảo đã cài PostgreSQL và tạo database "handmade_db"
# Lệnh tạo DB: CREATE DATABASE handmade_db;

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_handmade_dev
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
# Connection pool tối ưu cho local (nhiều connection hơn, timeout ngắn hơn)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=0
spring.datasource.hikari.pool-name=AdminHikariPool
spring.sql.init.mode=never
# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
# Tắt show-sql để giảm console noise và tăng tốc độ I/O
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Tối ưu batch để giảm số lượng query
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Tắt open-in-view để tránh lazy loading trong controller
spring.jpa.open-in-view=false
# Tối ưu second-level cache Hibernate
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
# Fetch size lớn hơn giảm round-trips
spring.jpa.properties.hibernate.jdbc.fetch_size=50
# ===== LOGGING - Chỉ INFO, tắt DEBUG để chạy nhanh =====
logging.level.root=WARN
logging.level.com.handmade=INFO
logging.level.org.springframework.security=WARN
logging.level.com.handmade.handmade_api.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
# ===== REDIS - Dùng cache in-memory nếu không có Redis =====
# Option 1: Nếu KHÔNG có Redis local → dùng simple cache (không cần Redis)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
app.cache.type=simple
# Option 2: Nếu CÓ Redis local (xoá 2 dòng exclude bên trên và uncomment dưới)
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.password=
# spring.data.redis.timeout=500
# app.cache.type=redis
# ===== VNPay Sandbox =====
vnpay.version=2.1.0
vnpay.command=pay
vnpay.curr-code=VND
vnpay.order-type=other
vnpay.locale=vn
vnpay.tmn-code=${VNPAY_TMN_CODE:HAFY0QN2}
vnpay.hash-secret=${VNPAY_HASH_SECRET:WFJUM4DTUZ03PV027MNNX0E9K2FCHQMX}
vnpay.hash-secret-token=${VNPAY_HASH_SECRET_TOKEN:WFJUM4DTUZ03PV027MNNX0E9K2FCHQMX}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payment/vnpay/return
vnpay.ipn-url=http://localhost:8080/api/payment/vnpay/ipn
# ===== JWT =====
jwt.secret=${JWT_SECRET:your_very_secure_secret_key_that_is_at_least_32_characters_long_123456}
# ===== GROQ AI =====
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.1-8b-instant
groq.temperature=0.7
# ===== OLLAMA LOCAL AI (tùy chọn, chạy 100% offline) =====
# Bật khi đã cài Ollama: https://ollama.com/download
# Lệnh tải model: ollama pull llama3.2:3b
# ollama.enabled=true để dùng Ollama trước Groq
ollama.enabled=true
ollama.base-url=http://localhost:11434
ollama.model=my-chatbot
ollama.timeout-ms=15000
# ===== CHATBOX =====
chat.allow-anonymous=true
chat.anonymous-session-timeout=30
chat.anonymous-session-prefix=ANON_
chat.max-context-messages=10
chat.faq-fallback-enabled=true
chat.config-cache-ttl=300
# ===== ERROR RESPONSE =====
server.error.include-message=always
# ===== DevTools - Hot reload nhanh hơn =====
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true